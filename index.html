<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジャグラー詳細カウンター＆設定判別</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #bb86fc;
            --grape-color: #9c27b0;
            --cherry-color: #f44336;
            --big-color: #e91e63;
            --reg-color: #2196f3;
            --danger-color: #cf6679;
            --border-radius: 12px;
            --highlight-color: rgba(187, 134, 252, 0.25);
            --highlight-border: #bb86fc;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        h1 {
            font-size: 1.1rem;
            margin: 0;
            font-weight: 600;
        }

        .reset-btn {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .machine-select {
            width: 100%;
            padding: 8px;
            background-color: #2c2c2c;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .games-input {
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: white;
            font-size: 1.4rem;
            padding: 8px;
            border-radius: 8px;
            text-align: right;
        }

        .counters-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .counter-card {
            display: flex;
            flex-direction: column;
            background-color: #2a2a2a;
            border-radius: var(--border-radius);
            padding: 12px;
        }

        .counter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .counter-name {
            font-size: 0.95rem;
            font-weight: bold;
        }

        .counter-value {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        .btn {
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            touch-action: manipulation;
        }

        .btn:active {
            opacity: 0.8;
            transform: scale(0.95);
        }

        .btn-plus { flex-grow: 1; padding: 10px; }
        .btn-minus { width: 40px; background-color: #616161; font-size: 1.2rem; }
        
        .grape { color: #ce93d8; }
        .cherry { color: #ef9a9a; }
        .big { color: #f48fb1; }
        .reg { color: #90caf9; }
        
        .bg-grape { background-color: var(--grape-color); }
        .bg-cherry { background-color: var(--cherry-color); }
        .bg-big { background-color: var(--big-color); }
        .bg-reg { background-color: var(--reg-color); }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            background-color: #2a2a2a;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .stat-item.total {
            grid-column: span 2;
            background-color: #333;
        }

        .stat-label { color: #aaa; }
        .stat-value { font-weight: bold; font-family: monospace; }

        .estimation-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            text-align: center;
        }
        .estimation-table th, .estimation-table td {
            padding: 6px 2px;
            border: 1px solid #444;
        }
        .estimation-table th { background-color: #2c2c2c; color: #aaa; }
        .estimation-table tr.highlight {
            background-color: var(--highlight-color);
            border: 2px solid var(--highlight-border);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ジャグラー詳細カウンター</h1>
        <button class="reset-btn" onclick="resetAll()">全リセット</button>
    </header>

    <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <label for="machineSelect" style="font-size: 0.9rem; font-weight: bold; margin: 0;">機種</label>
            <select id="machineSelect" class="machine-select" style="flex-grow: 1; max-width: 75%;" onchange="changeMachine()">
                <option value="my_juggler_v">マイジャグラーV</option>
                <option value="im_juggler_ex">アイムジャグラーEX</option>
                <option value="funky_juggler_2">ファンキージャグラー2</option>
                <option value="gogo_juggler_3">ゴーゴージャグラー3</option>
                <option value="happy_juggler_v3">ハッピージャグラーV III</option>
            </select>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between;">
            <label for="totalGames" style="font-size: 0.9rem; font-weight: bold; margin: 0;">総ゲーム</label>
            <div style="display: flex; align-items: center; gap: 8px; flex-grow: 1; justify-content: flex-end;">
                <input type="number" id="totalGames" class="games-input" value="0" min="0" style="width: 90px;" onchange="updateStats(); saveData()" oninput="updateStats()">
                <span style="font-size: 1.1rem;">G</span>
                <button class="btn bg-grape" style="font-size: 0.9rem; padding: 10px; border-radius: 6px;" onclick="addGames(100)">+100</button>
            </div>
        </div>
    </div>

    <div class="counters-grid">
        <div class="counter-card">
            <div class="counter-header grape">
                <span class="counter-name">ぶどう</span>
                <span class="counter-value" id="val-grape">0</span>
            </div>
            <div class="controls">
                <button class="btn btn-minus" onclick="changeCount('grape', -1)">-</button>
                <button class="btn btn-plus bg-grape" onclick="changeCount('grape', 1)">+</button>
            </div>
        </div>

        <div class="counter-card">
            <div class="counter-header cherry">
                <span class="counter-name">角チェリー<span style="font-size:0.7rem; color:#aaa">(非重複)</span></span>
                <span class="counter-value" id="val-cherry">0</span>
            </div>
            <div class="controls">
                <button class="btn btn-minus" onclick="changeCount('cherry', -1)">-</button>
                <button class="btn btn-plus bg-cherry" onclick="changeCount('cherry', 1)">+</button>
            </div>
        </div>

        <div class="counter-card">
            <div class="counter-header big">
                <span class="counter-name">単独BIG</span>
                <span class="counter-value" id="val-solo_big">0</span>
            </div>
            <div class="controls">
                <button class="btn btn-minus" onclick="changeCount('solo_big', -1)">-</button>
                <button class="btn btn-plus bg-big" onclick="changeCount('solo_big', 1)">+</button>
            </div>
        </div>

        <div class="counter-card">
            <div class="counter-header big">
                <span class="counter-name">チェリーBIG</span>
                <span class="counter-value" id="val-cherry_big">0</span>
            </div>
            <div class="controls">
                <button class="btn btn-minus" onclick="changeCount('cherry_big', -1)">-</button>
                <button class="btn btn-plus bg-big" onclick="changeCount('cherry_big', 1)">+</button>
            </div>
        </div>

        <div class="counter-card">
            <div class="counter-header reg">
                <span class="counter-name">単独REG</span>
                <span class="counter-value" id="val-solo_reg">0</span>
            </div>
            <div class="controls">
                <button class="btn btn-minus" onclick="changeCount('solo_reg', -1)">-</button>
                <button class="btn btn-plus bg-reg" onclick="changeCount('solo_reg', 1)">+</button>
            </div>
        </div>

        <div class="counter-card">
            <div class="counter-header reg">
                <span class="counter-name">チェリーREG</span>
                <span class="counter-value" id="val-cherry_reg">0</span>
            </div>
            <div class="controls">
                <button class="btn btn-minus" onclick="changeCount('cherry_reg', -1)">-</button>
                <button class="btn btn-plus bg-reg" onclick="changeCount('cherry_reg', 1)">+</button>
            </div>
        </div>
    </div>

    <div class="card">
        <h2 style="font-size: 1rem; margin-top: 0; color: #aaa;">現在確率</h2>
        <div class="stats-grid">
            <div class="stat-item total">
                <span class="stat-label">ボーナス合算</span>
                <span class="stat-value" id="stat-total">1/0.0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">ぶどう</span>
                <span class="stat-value" id="stat-grape">1/0.0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">チェリー</span>
                <span class="stat-value" id="stat-cherry">1/0.0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">単独BIG</span>
                <span class="stat-value" id="stat-solo_big">1/0.0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">単独REG</span>
                <span class="stat-value" id="stat-solo_reg">1/0.0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">チェリーBIG</span>
                <span class="stat-value" id="stat-cherry_big">1/0.0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">チェリーREG</span>
                <span class="stat-value" id="stat-cherry_reg">1/0.0</span>
            </div>
        </div>

        <h3 style="font-size: 0.85rem; margin-top: 16px; color: #aaa;">設定推測表 <span style="font-size: 0.7rem;">(単独REG・ぶどうを重視)</span></h3>
        <table class="estimation-table">
            <thead>
                <tr>
                    <th>設</th>
                    <th>合算</th>
                    <th>単独R</th>
                    <th>チェR</th>
                    <th>単独B</th>
                    <th>ぶどう</th>
                </tr>
            </thead>
            <tbody id="estimation-tbody">
            </tbody>
        </table>
    </div>
</div>

<script>
    // Detailed probabilities (denominator)
    const machines = {
        my_juggler_v: [
            { setting: 1, total: 163.8, solo_reg: 546, cherry_reg: 1638, solo_big: 385, grape: 5.93 },
            { setting: 2, total: 159.1, solo_reg: 512, cherry_reg: 1560, solo_big: 372, grape: 5.93 },
            { setting: 3, total: 148.6, solo_reg: 436, cherry_reg: 1489, solo_big: 356, grape: 5.93 },
            { setting: 4, total: 135.4, solo_reg: 390, cherry_reg: 1129, solo_big: 341, grape: 5.93 },
            { setting: 5, total: 126.6, solo_reg: 356, cherry_reg: 1092, solo_big: 327, grape: 5.76 },
            { setting: 6, total: 114.6, solo_reg: 327, cherry_reg: 771,  solo_big: 307, grape: 5.66 }
        ],
        im_juggler_ex: [
            { setting: 1, total: 168.5, solo_reg: 627, cherry_reg: 1489, solo_big: 385, grape: 6.02 },
            { setting: 2, total: 161.0, solo_reg: 546, cherry_reg: 1489, solo_big: 385, grape: 6.02 },
            { setting: 3, total: 151.7, solo_reg: 496, cherry_reg: 1149, solo_big: 385, grape: 6.02 },
            { setting: 4, total: 142.2, solo_reg: 431, cherry_reg: 1170, solo_big: 368, grape: 6.02 },
            { setting: 5, total: 127.5, solo_reg: 366, cherry_reg: 830,  solo_big: 368, grape: 6.02 },
            { setting: 6, total: 127.5, solo_reg: 366, cherry_reg: 830,  solo_big: 352, grape: 5.78 }
        ],
        funky_juggler_2: [
            { setting: 1, total: 165.9, solo_reg: 630, cherry_reg: 1456, solo_big: 385, grape: 6.00 },
            { setting: 2, total: 158.3, solo_reg: 585, cherry_reg: 1337, solo_big: 372, grape: 5.90 },
            { setting: 3, total: 150.7, solo_reg: 504, cherry_reg: 1337, solo_big: 364, grape: 5.90 },
            { setting: 4, total: 140.3, solo_reg: 425, cherry_reg: 1337, solo_big: 348, grape: 5.80 },
            { setting: 5, total: 133.3, solo_reg: 399, cherry_reg: 1191, solo_big: 334, grape: 5.80 },
            { setting: 6, total: 119.6, solo_reg: 356, cherry_reg: 992,  solo_big: 304, grape: 5.75 }
        ],
        gogo_juggler_3: [
            { setting: 1, total: 158.8, solo_reg: 528, cherry_reg: 1598, solo_big: 364, grape: 6.20 },
            { setting: 2, total: 154.6, solo_reg: 504, cherry_reg: 1560, solo_big: 356, grape: 6.20 },
            { setting: 3, total: 147.3, solo_reg: 442, cherry_reg: 1560, solo_big: 348, grape: 6.20 },
            { setting: 4, total: 138.9, solo_reg: 409, cherry_reg: 1365, solo_big: 334, grape: 6.10 },
            { setting: 5, total: 128.0, solo_reg: 341, cherry_reg: 1456, solo_big: 318, grape: 6.00 },
            { setting: 6, total: 115.4, solo_reg: 297, cherry_reg: 1024, solo_big: 318, grape: 5.90 }
        ],
        happy_juggler_v3: [
            { setting: 1, total: 161.8, solo_reg: 585, cherry_reg: 1236, solo_big: 409, grape: 6.05 },
            { setting: 2, total: 154.9, solo_reg: 528, cherry_reg: 1149, solo_big: 404, grape: 6.04 },
            { setting: 3, total: 146.9, solo_reg: 474, cherry_reg: 1110, solo_big: 390, grape: 6.02 },
            { setting: 4, total: 137.7, solo_reg: 420, cherry_reg: 1057, solo_big: 372, grape: 5.90 },
            { setting: 5, total: 127.5, solo_reg: 372, cherry_reg: 1024, solo_big: 356, grape: 5.81 },
            { setting: 6, total: 120.0, individual: true, solo_reg: 356, cherry_reg: 910, solo_big: 327, grape: 5.75 }
        ]
    };

    let counts = { grape: 0, cherry: 0, solo_big: 0, cherry_big: 0, solo_reg: 0, cherry_reg: 0 };

    function loadData() {
        const savedCounts = localStorage.getItem('juggler_detailed_counts');
        const savedGames = localStorage.getItem('juggler_games');
        const savedMachine = localStorage.getItem('juggler_machine');
        
        if (savedMachine) document.getElementById('machineSelect').value = savedMachine;
        if (savedGames) document.getElementById('totalGames').value = savedGames;

        if (savedCounts) {
            try {
                const parsed = JSON.parse(savedCounts);
                if(parsed.solo_reg !== undefined) {
                    counts = parsed;
                }
            } catch(e) {}
        }
        
        Object.keys(counts).forEach(key => {
            if(document.getElementById(`val-${key}`)) {
                document.getElementById(`val-${key}`).innerText = counts[key];
            }
        });
        
        renderEstimationTable();
        updateStats();
    }

    function saveData() {
        localStorage.setItem('juggler_detailed_counts', JSON.stringify(counts));
        localStorage.setItem('juggler_games', document.getElementById('totalGames').value);
        localStorage.setItem('juggler_machine', document.getElementById('machineSelect').value);
    }

    function changeCount(type, amount) {
        counts[type] += amount;
        if (counts[type] < 0) counts[type] = 0;
        
        document.getElementById(`val-${type}`).innerText = counts[type];
        saveData();
        updateStats();
    }

    function addGames(amount) {
        const input = document.getElementById('totalGames');
        let current = parseInt(input.value) || 0;
        input.value = current + amount;
        saveData();
        updateStats();
    }
    
    function changeMachine() {
        saveData();
        renderEstimationTable();
        updateStats();
    }

    function renderEstimationTable() {
        const machineKey = document.getElementById('machineSelect').value;
        const data = machines[machineKey];
        const tbody = document.getElementById('estimation-tbody');
        tbody.innerHTML = '';

        data.forEach(d => {
            const tr = document.createElement('tr');
            tr.id = `row-setting-${d.setting}`;
            tr.innerHTML = `
                <td>${d.setting}</td>
                <td>1/${d.total.toFixed(1)}</td>
                <td>1/${d.solo_reg}</td>
                <td>1/${d.cherry_reg}</td>
                <td>1/${d.solo_big}</td>
                <td>1/${d.grape.toFixed(2)}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateStats() {
        const games = parseInt(document.getElementById('totalGames').value) || 0;
        const currentRatios = { grape: 0, solo_reg: 0, cherry_reg: 0, total: 0 };

        const updateRatio = (type) => {
            const el = document.getElementById(`stat-${type}`);
            if (counts[type] > 0) {
                const ratio = games / counts[type];
                if (currentRatios[type] !== undefined) currentRatios[type] = ratio;
                el.innerText = `1/${ratio.toFixed(1)}`;
            } else {
                el.innerText = '1/0.0';
            }
        };

        ['grape', 'cherry', 'solo_big', 'cherry_big', 'solo_reg', 'cherry_reg'].forEach(updateRatio);

        const totalBonus = counts.solo_big + counts.cherry_big + counts.solo_reg + counts.cherry_reg;
        const totalBonusEl = document.getElementById('stat-total');
        if (totalBonus > 0) {
            const ratio = games / totalBonus;
            currentRatios.total = ratio;
            totalBonusEl.innerText = `1/${ratio.toFixed(1)}`;
        } else {
            totalBonusEl.innerText = '1/0.0';
        }

        highlightClosestSetting(currentRatios, games);
    }

    function highlightClosestSetting(ratios, games) {
        const machineKey = document.getElementById('machineSelect').value;
        const data = machines[machineKey];
        
        data.forEach(d => {
            document.getElementById(`row-setting-${d.setting}`).classList.remove('highlight');
        });

        // Highlight works if there's enough data (e.g. at least 1 solo reg)
        if (games < 100 || ratios.solo_reg === 0) return;

        let closestSetting = 1;
        let minDistance = Infinity;

        data.forEach(d => {
            // Distance weighting: Solo REG is king, Grape is secondary
            const soloRegDist = Math.pow((ratios.solo_reg - d.solo_reg) / d.solo_reg, 2) * 3.0;
            const grapeDist = ratios.grape > 0 ? Math.pow((ratios.grape - d.grape) / d.grape, 2) * 1.5 : 0;
            const cherryRegDist = ratios.cherry_reg > 0 ? Math.pow((ratios.cherry_reg - d.cherry_reg) / d.cherry_reg, 2) * 0.5 : 0;
            const totalDist = Math.pow((ratios.total - d.total) / d.total, 2) * 0.5; 
            
            const totalDistance = soloRegDist + grapeDist + cherryRegDist + totalDist;
            
            if (totalDistance < minDistance) {
                minDistance = totalDistance;
                closestSetting = d.setting;
            }
        });

        document.getElementById(`row-setting-${closestSetting}`).classList.add('highlight');
    }

    function resetAll() {
        if (confirm("全てのデータをリセットしますか？")) {
            counts = { grape: 0, cherry: 0, solo_big: 0, cherry_big: 0, solo_reg: 0, cherry_reg: 0 };
            document.getElementById('totalGames').value = 0;
            saveData();
            loadData(); // Re-render everything
        }
    }

    // Initialize
    window.onload = loadData;
</script>

</body>
</html>
